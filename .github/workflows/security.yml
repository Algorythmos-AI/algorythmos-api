name: security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 20 * * 0" # weekly, Monday 06:00 Sydney

permissions:
  contents: read

jobs:
  security:
    uses: Algorythmos-AI/.github/.github/workflows/security.yml@1078ed679bed88c7a41744cda79aa505eb4ff277
    with:
      semgrep: true # frontend/ is Next.js/TypeScript

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: pip-audit the runtime requirements
        run: uvx "$(grep '^pip-audit==' dev-requirements.txt)" --strict --no-deps --disable-pip -r requirements.txt
