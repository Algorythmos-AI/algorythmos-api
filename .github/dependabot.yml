# From the org template (Algorythmos-AI/.github templates/dependabot.yml).
# Trunk repository: updates target main. Minor and patch updates are grouped weekly.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: { interval: monthly }
