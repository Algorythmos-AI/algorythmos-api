[pytest]
# pytest.ini takes precedence over [tool.pytest.ini_options] in pyproject.toml.
addopts = -q --strict-markers -m "not integration"
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    timeout: per-test timeout provided by pytest-timeout
    integration: needs external services (Redis); run with `pytest -m integration`
    slow: marks tests as slow
# default timeout for tests without the decorator (seconds)
timeout = 10
timeout_method = thread
