# Local guardrails. Enable once per clone: `pre-commit install`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      - id: ruff
        args: ["--select", "E9,F63,F7,F82,PLE"]
  - repo: local
    hooks:
      - id: no-asyncsession-in-routes
        name: no AsyncSession annotations in route handlers
        entry: python -m pytest -q -p no:cacheprovider tests/static/test_no_asyncsession_in_routes.py
        language: system
        pass_filenames: false
        files: \.py$
      - id: no-real-documents
        name: no PDFs or CSVs outside synthetic fixtures
        entry: "Real documents must not be committed; generate synthetic fixtures in tests/fixtures/ instead."
        language: fail
        files: \.(pdf|csv)$
        exclude: ^(tests/data/(valid|corrupt)_test\.pdf|public/)
