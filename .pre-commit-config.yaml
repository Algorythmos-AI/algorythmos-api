# Pre-commit hooks configuration
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # CRITICAL: Prevent AsyncSession type annotations in route handlers
  # This caused a production outage on Vercel (OpenAPI 500 error)
  - repo: local
    hooks:
      - id: no-asyncsession-in-routes
        name: Block AsyncSession type annotations in routes
        entry: bash -c 'if grep -rn "AsyncSession\s*=\s*Depends\|: AsyncSession\s*=" --include="*.py" app.py api/ 2>/dev/null; then echo "❌ FORBIDDEN: AsyncSession type annotations found in route handlers. Use db = Depends(get_session) without type annotation."; exit 1; fi'
        language: system
        files: \.py$
        pass_filenames: false